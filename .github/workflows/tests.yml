name: tests

# The job MiniMind never had. Every test here runs on a CPU runner with no
# dataset and no network, so there is no excuse for it not to run on every push.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what this repository is developed and verified on; 3.12 is
        # included so the suite does not quietly become 3.14-only.
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run the whole suite
        run: python -m pytest

      # A test is never deleted. The floor lives in
      # tests/test_suite_gate.py::test_the_suite_is_not_quietly_shrinking, so
      # this step exists to make the rule visible in the build log — and to
      # fail if collection itself breaks. An earlier version of this step
      # printed the count and exited 0, which is not a check.
      - name: Report the collected count
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tail -1

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --durations=10
# No marker for skipping. There is deliberately no "slow" or "gpu" marker:
# every test in this repository runs on CPU, without a dataset or network, and
# the whole suite is required to finish inside 120 seconds.
filterwarnings =
    error::DeprecationWarning:m3g4m1nd.*
